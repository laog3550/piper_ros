<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数据采集控制台</title>
<style>
:root { color-scheme: dark; font-family: system-ui, sans-serif; background:#10151d; color:#edf3f8; }
body { max-width:1200px; margin:0 auto; padding:24px; }
header { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; }
h1 { font-size:1.6rem; margin:0; }
.badge { border-radius:999px; padding:6px 12px; background:#273240; }
.badge.recording { background:#922d39; color:white; animation:pulse 1.5s infinite; }
@keyframes pulse { 50% { opacity:.65; } }
section { background:#1b2530; border:1px solid #334354; border-radius:12px; padding:18px; margin-top:18px; }
h2 { font-size:1.05rem; margin:0 0 14px; }
.grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
.camera { background:#10151d; border-radius:8px; overflow:hidden; }
.camera img { width:100%; aspect-ratio:16/8; object-fit:contain; display:block; }
.camera p { padding:0 12px; font-size:.85rem; margin:6px 0 10px; overflow-wrap:anywhere; }
.camera h3 { padding:0 12px; margin:10px 0 4px; font-size:.95rem; }
.muted { color:#aab8c8; }
label { display:block; margin:12px 0 6px; }
input,textarea,select { width:100%; box-sizing:border-box; border:1px solid #607187; border-radius:7px; background:#111922; color:white; padding:10px; font:inherit; }
textarea { min-height:75px; resize:vertical; }
button { background:#3979dc; border:0; color:white; border-radius:7px; padding:10px 16px; cursor:pointer; font:inherit; margin:8px 8px 0 0; }
button.secondary { background:#41546b; }
button.danger { background:#a23644; }
button:disabled { opacity:.45; cursor:not-allowed; }
.row { display:flex; flex-wrap:wrap; align-items:end; gap:10px; }
.row > * { flex:1; min-width:160px; }
.notice { min-height:1.5em; color:#ffd47b; }
.error { color:#ff9aa5; }
.tablewrap { overflow-x:auto; }
table { border-collapse:collapse; width:100%; font-size:.9rem; }
th,td { padding:9px; border-bottom:1px solid #334354; text-align:left; }
@media(max-width:700px){ .grid { grid-template-columns:1fr; } body { padding:12px; } }
</style>
</head>
<body>
<header><h1>数据采集控制台</h1><span id="state" class="badge">连接中</span></header>
<p class="muted">录制由独立的 Episode 服务执行。关闭本页不会中断录制；Rerun 可独立查看详细数据。</p>
<section><h2>三路相机</h2><div id="cameras" class="grid"></div></section>
<section>
<h2>录制操作</h2>
<div id="current" class="muted">正在读取状态…</div>
<label for="mode">采集类型</label><select id="mode"><option value="skill">单技能片段（VLM）</option><option value="task">原有任务 Episode</option></select>
<label for="task">任务名</label><input id="task" maxlength="120" placeholder="例如：拾取杯子">
<label for="instruction">长任务描述 / 原有语言指令</label><textarea id="instruction" maxlength="2000" placeholder="例如：把桌上的杯子放入收纳盒"></textarea>
<div id="skillFields">
<div class="row"><div><label for="skill">当前原子技能</label><input id="skill" maxlength="120" placeholder="例如：grasp"></div><div><label for="skill_instruction">该技能短指令</label><input id="skill_instruction" maxlength="2000" placeholder="例如：抓住蓝色杯子"></div></div>
<div class="row"><div><label for="target_object_id">目标物体 ID（可留空）</label><input id="target_object_id" placeholder="例如：cup_1"></div><div><label for="target_location_id">目标位置 ID（可留空）</label><input id="target_location_id" placeholder="例如：tray_1"></div></div>
<div class="row"><div><label for="plan_id">关联规划（可留空）</label><select id="plan_id"><option value="">不关联规划</option></select></div><div><label for="task_group_id">task_group_id（可留空自动生成）</label><input id="task_group_id" placeholder="同一长任务的片段填写相同 ID"></div></div>
<label for="expected_state_change">预期状态变化</label><textarea id="expected_state_change" placeholder="例如：杯子由桌面变为夹爪持有"></textarea>
<label for="completion_criteria">完成判据</label><textarea id="completion_criteria" placeholder="例如：杯子稳定离开桌面"></textarea>
</div>
<label for="duration">本条时长上限（秒，到时自动停止）</label><input id="duration" type="number" min="1" max="86400" step="1" value="60">
<label for="save_dir">Episode 保存目录（每次保存可修改）</label><input id="save_dir" placeholder="绝对路径；自动创建 episode_000001 等目录">
<div class="row"><button id="start">开始录制</button><button id="stop" class="secondary">停止录制</button></div>
<label for="outcome">人工结果</label><select id="outcome"><option value="">请选择</option><option value="success">成功</option><option value="failure">失败</option><option value="unknown">无法判断</option></select>
<div id="vlmResult">
<label for="failure_reason">失败原因（失败时必填）</label><select id="failure_reason"><option value="">请选择</option><option value="execution_error">执行错误</option><option value="grasp_failed">抓取失败</option><option value="object_not_found">未找到物体</option><option value="placement_failed">放置失败</option><option value="other">其他</option><option value="unable_to_determine">无法判断</option></select>
<label for="failure_reason_detail">其他失败原因补充</label><input id="failure_reason_detail" placeholder="选择“其他”时可填写">
<label for="observed_state_change">实际观察到的状态变化（未知可留空）</label><textarea id="observed_state_change"></textarea>
<div class="row"><div><label for="next_decision">人工确认的下一决策</label><select id="next_decision"><option value="">请选择</option><option value="continue">continue</option><option value="retry">retry</option><option value="reobserve">reobserve</option><option value="replan">replan</option><option value="stop">stop</option><option value="ask_human">ask_human</option></select></div><div><label for="next_skill">下一技能（可留空）</label><input id="next_skill" maxlength="120"></div></div>
</div>
<div class="row"><button id="save">保存 Episode</button><button id="discard" class="danger">丢弃 Episode</button></div>
<p class="muted">结果标签只记录人工判断；夹爪映射未经核对时，七维示教向量无效，不可用于动作训练。</p>
<p id="notice" class="notice" role="status"></p>
</section>
<section>
<h2>长任务规划样本</h2><p class="muted">可独立录入规划，无需完整任务录像。保存后在上方选择关联规划。</p>
<label for="plan_description">长任务描述</label><textarea id="plan_description" placeholder="例如：把桌上的杯子放入收纳盒"></textarea>
<div class="row"><div><label for="plan_objects">场景物体 ID（逗号分隔）</label><input id="plan_objects" placeholder="cup_1, box_1"></div><div><label for="plan_locations">场景位置 ID（逗号分隔）</label><input id="plan_locations" placeholder="table_1, tray_1"></div></div>
<label for="plan_group">task_group_id（可留空自动生成）</label><input id="plan_group">
<label for="plan_steps">有序技能步骤（每行：技能 | 目标物体 ID | 目标位置 ID | 完成判据；不适用的 ID 留空）</label><textarea id="plan_steps" placeholder="grasp | cup_1 | | 杯子稳定离开桌面&#10;place | cup_1 | tray_1 | 杯子进入托盘"></textarea>
<button id="create_plan">保存规划样本</button><button id="export_vlm" class="secondary">导出 VLM 样本 JSON</button><p id="plan_notice" class="notice" role="status"></p>
</section>
<section><h2>已保存 Episode</h2><div class="tablewrap"><table><thead><tr><th>编号</th><th>任务</th><th>语言指令</th><th>结果</th><th>录制时长</th><th>开始时间</th><th>路径</th></tr></thead><tbody id="episodes"></tbody></table></div></section>
<script>
const $ = id => document.getElementById(id);
const labels = {idle:'空闲',starting:'启动中',recording:'录制中',stopped:'已停止，待保存',failed:'失败，待丢弃',interrupted:'意外中断，待丢弃',saved:'已保存',discarded:'已丢弃'};
const cameraNodes = [];
for (let i=0;i<3;i++) {
  const card = document.createElement('div'); card.className='camera';
  const title = document.createElement('h3'); title.textContent=['左腕','右腕','顶部'][i];
  const colorTitle = document.createElement('p'); colorTitle.textContent='彩色';
  const colorImg = document.createElement('img'); colorImg.alt=`${title.textContent}彩色预览`;
  const colorStatus = document.createElement('p'); colorStatus.textContent='等待彩色画面…';
  const depthTitle = document.createElement('p'); depthTitle.textContent='深度 · 正在读取色标…';
  const depthImg = document.createElement('img'); depthImg.alt=`${title.textContent}深度预览`;
  const depthStatus = document.createElement('p'); depthStatus.textContent='等待深度画面…';
  card.append(title,colorTitle,colorImg,colorStatus,depthTitle,depthImg,depthStatus);
  $('cameras').append(card); cameraNodes.push({colorImg,colorStatus,depthTitle,depthImg,depthStatus});
}
let busy = false, state = 'unknown', currentIsVlm = false, plansById = {};
function notice(text, error=false) { $('notice').textContent=text; $('notice').className=error?'notice error':'notice'; }
async function readJson(response) { const data=await response.json(); if(!response.ok || !data.ok) throw Error(data.error || '操作失败'); return data; }
function updateButtons() {
  $('start').disabled=busy || state!=='idle'; $('stop').disabled=busy || state!=='recording';
  $('save').disabled=busy || state!=='stopped' || !$('outcome').value || (currentIsVlm && (!$('next_decision').value || ($('outcome').value==='failure' && !$('failure_reason').value)));
  $('discard').disabled=busy || !['stopped','failed','interrupted','recording','starting'].includes(state);
}
async function refresh() {
  try {
    const data=await readJson(await fetch('/api/status', {cache:'no-store'}));
    const result=data.result; state=result.state;
    if (!$('save_dir').value) $('save_dir').value=data.default_save_dir || '';
    $('state').textContent=labels[state] || state; $('state').className='badge '+(state==='recording'?'recording':'');
    const meta=result.metadata || {};
    currentIsVlm=!!meta.task_metadata?.vlm;
    if(currentIsVlm && !$('task_group_id').value) $('task_group_id').value=meta.task_metadata.vlm.task_group_id;
    $('vlmResult').hidden=state==='idle' ? $('mode').value!=='skill' : !currentIsVlm;
    const remaining=state==='recording' && result.remaining_sec!=null ? ` · 剩余约 ${Math.ceil(result.remaining_sec)} 秒` : '';
    const timed=meta.stop_reason==='duration_limit' ? ' · 已到时自动停止' : '';
    $('current').textContent=meta.episode_id ? `Episode ${meta.episode_id} · ${meta.task || ''} · ${meta.error || labels[state]}${remaining}${timed}` : (result.pending?.length ? `有 ${result.pending.length} 个未处理暂存 Episode，请丢弃后重试` : '当前无活动 Episode');
    for(let i=0;i<3;i++) {
      const camera=data.cameras[i], item=cameraNodes[i];
      item.depthTitle.textContent=`深度 · 0–${camera.depth.max_meters} 米；灰色超距，黑色无效，白线为彩色轮廓`;
      for(const kind of ['color','depth']) {
        const stream=camera[kind], image=item[`${kind}Img`], status=item[`${kind}Status`];
        status.textContent=`${stream.online?'在线':'无新画面'}${stream.error?' · '+stream.error:''} · ${stream.topic}`;
        if(stream.online) image.src=`/camera/${kind}/${i}.jpg?t=${Date.now()}`; else image.removeAttribute('src');
      }
    }
    updateButtons();
  } catch(error) { state='unknown'; $('state').textContent='录制服务未连接'; $('state').className='badge'; $('current').textContent=error.message; updateButtons(); }
}
async function loadEpisodes() {
  try {
    const data=await readJson(await fetch('/api/episodes', {cache:'no-store'}));
    const body=$('episodes'); body.replaceChildren();
    for(const episode of data.result.episodes) {
      const tr=document.createElement('tr');
      const values=[episode.episode_number,episode.task,episode.language_instruction,episode.outcome==='success'?'成功':episode.outcome==='failure'?'失败':episode.outcome==='unknown'?'无法判断':'未标注',episode.recorded_duration_sec==null?'':`${episode.recorded_duration_sec.toFixed(1)} 秒`,episode.started_at_unix_ns?new Date(episode.started_at_unix_ns/1e6).toLocaleString():'',episode.path];
      for(const value of values) { const td=document.createElement('td'); td.textContent=value ?? ''; tr.append(td); }
      body.append(tr);
    }
    if(!data.result.episodes.length) { const tr=document.createElement('tr'), td=document.createElement('td'); td.colSpan=7; td.textContent='暂无已保存 Episode'; tr.append(td); body.append(tr); }
  } catch(error) { notice(error.message,true); }
}
async function action(name, payload={}) {
  busy=true; updateButtons(); notice('正在执行…');
  try {
    await readJson(await fetch(`/api/${name}`, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}));
    notice(({start:'已开始录制',stop:'已停止录制',save:'已保存 Episode',discard:'已丢弃 Episode'})[name]);
    if(name==='save') { $('task').value=''; $('instruction').value=''; $('outcome').value=''; $('next_decision').value=''; $('failure_reason').value=''; }
    await refresh(); if(name==='save' || name==='discard') await loadEpisodes();
  } catch(error) { notice(error.message,true); await refresh(); }
  finally { busy=false; updateButtons(); }
}
function ids(text) { return text.split(',').map(x=>x.trim()).filter(Boolean); }
async function loadPlans() {
  try {
    const data=await readJson(await fetch('/api/plans', {cache:'no-store'}));
    const select=$('plan_id'), chosen=select.value;
    plansById=Object.fromEntries(data.result.plans.map(plan=>[plan.plan_id,plan]));
    select.replaceChildren(new Option('不关联规划',''));
    for(const plan of data.result.plans) select.add(new Option(`${plan.plan_id} · ${plan.long_task_description.slice(0,40)}`,plan.plan_id));
    select.value=chosen;
  } catch(error) { $('plan_notice').textContent=error.message; }
}
$('mode').onchange=()=>{ $('skillFields').hidden=$('mode').value!=='skill'; if(state==='idle') $('vlmResult').hidden=$('mode').value!=='skill'; };
$('plan_id').onchange=()=>{
  const plan=plansById[$('plan_id').value];
  if(plan) { $('task_group_id').value=plan.task_group_id; if(!$('instruction').value.trim()) $('instruction').value=plan.long_task_description; }
};
$('start').onclick=()=>{
  const base={task:$('task').value,duration_sec:Number($('duration').value)};
  if($('mode').value==='skill') {
    base.skill=$('skill').value;
    base.vlm={task_group_id:$('task_group_id').value.trim(),plan_id:$('plan_id').value,
      long_task_description:$('instruction').value,skill_instruction:$('skill_instruction').value,
      target_object_id:$('target_object_id').value.trim(),target_location_id:$('target_location_id').value.trim(),
      expected_state_change:$('expected_state_change').value,completion_criteria:$('completion_criteria').value};
  } else base.language_instruction=$('instruction').value;
  action('start',base);
};
$('stop').onclick=()=>action('stop');
$('save').onclick=()=>{
  const payload={outcome:$('outcome').value,save_dir:$('save_dir').value.trim()};
  if(currentIsVlm) payload.annotation={outcome:$('outcome').value,
    failure_reason:$('outcome').value==='failure' ? $('failure_reason').value : null,
    failure_reason_detail:$('outcome').value==='failure' && $('failure_reason').value==='other' ? $('failure_reason_detail').value : null,
    observed_state_change:$('observed_state_change').value,next_decision:$('next_decision').value,
    next_skill:$('next_skill').value};
  action('save',payload);
};
$('discard').onclick=()=>{ if(confirm('确定丢弃当前 Episode？录制数据将被删除。')) action('discard'); };
$('create_plan').onclick=async()=>{
  try {
    const steps=$('plan_steps').value.split('\n').map(line=>line.trim()).filter(Boolean).map(line=>{
      const parts=line.split('|').map(x=>x.trim());
      if(parts.length!==4) throw Error('每行步骤需要 4 列，用 | 分隔');
      return {skill:parts[0],target_object_id:parts[1],target_location_id:parts[2],completion_criteria:parts[3]};
    });
    const data=await readJson(await fetch('/api/plan_create',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({task_group_id:$('plan_group').value.trim(),long_task_description:$('plan_description').value,
        object_ids:ids($('plan_objects').value),location_ids:ids($('plan_locations').value),steps})}));
    $('plan_notice').textContent=`已保存规划 ${data.result.plan_id}`;
    await loadPlans(); $('plan_id').value=data.result.plan_id;
    $('task_group_id').value=data.result.task_group_id;
  } catch(error) { $('plan_notice').textContent=error.message; }
};
$('export_vlm').onclick=async()=>{
  try {
    const data=await readJson(await fetch('/api/vlm/export',{cache:'no-store'}));
    const blob=new Blob([JSON.stringify(data.result,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob), link=document.createElement('a');
    link.href=url; link.download='vlm_samples.json'; link.click(); URL.revokeObjectURL(url);
    $('plan_notice').textContent='VLM 样本已导出';
  } catch(error) { $('plan_notice').textContent=error.message; }
};
$('outcome').onchange=updateButtons; $('failure_reason').onchange=updateButtons; $('next_decision').onchange=updateButtons;
refresh(); loadEpisodes(); loadPlans(); setInterval(refresh,1500); setInterval(loadEpisodes,10000);
</script>
</body>
</html>
